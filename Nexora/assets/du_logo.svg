<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="32" fill="#FFFFFF"/>
  
  <!-- DELHI UNIVERSITY ROYAL CIRCULAR SEAL -->
  <g transform="translate(100, 20)">
    <circle cx="100" cy="100" r="95" fill="#4B0082"/>
    <circle cx="100" cy="100" r="84" fill="#FFFFFF"/>
    <circle cx="100" cy="100" r="76" fill="#4B0082"/>
    
    <!-- Stylized Elephant & Lotus Crown Emblem -->
    <path d="M 65,115 C 65,85 135,85 135,115 L 125,145 C 100,150 100,150 75,145 Z" fill="#D4AF37"/>
    <circle cx="100" cy="78" r="14" fill="#D4AF37"/>
    <polygon points="100,52 108,68 92,68" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY -->
  <text x="200" y="278" font-family="'Times New Roman', Times, serif" font-size="44" font-weight="900" fill="#4B0082" text-anchor="middle" letter-spacing="2">UNIVERSITY</text>
  <text x="200" y="325" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="800" fill="#1A1A1A" text-anchor="middle" letter-spacing="4">OF DELHI</text>
  <text x="200" y="362" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#D4AF37" text-anchor="middle" letter-spacing="6">ESTD. 1922</text>
</svg>
