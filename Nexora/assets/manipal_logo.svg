<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="32" fill="#FFFFFF"/>
  
  <!-- BLACK EMBLEM BOX CENTERED -->
  <rect x="135" y="20" width="130" height="170" rx="16" fill="#000000"/>

  <!-- ORANGE INSIGNIA INSIDE BOX -->
  <!-- Floating angled oval -->
  <ellipse cx="200" cy="68" rx="18" ry="13" transform="rotate(-15 200 68)" fill="#E65A00"/>
  <!-- 3-Pronged Tree / Flame Shape -->
  <path d="M 158,102 C 158,93 242,93 242,102 L 242,115 C 242,119 235,121 229,119 L 229,152 C 229,157 222,160 216,160 C 210,160 205,157 205,152 L 205,121 L 195,121 L 195,152 C 195,157 189,160 184,160 C 178,160 171,157 171,152 L 171,119 C 165,121 158,119 158,115 Z" fill="#E65A00"/>

  <!-- Manipal Script Text inside Box -->
  <text x="200" y="174" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Manipal</text>

  <!-- TAGLINE -->
  <text x="200" y="222" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#E65A00" text-anchor="middle" letter-spacing="2">INSPIRED BY LIFE</text>

  <!-- MANIPAL TYPOGRAPHY -->
  <text x="200" y="285" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="400" fill="#000000" text-anchor="middle" letter-spacing="4">MANIPAL</text>

  <!-- Orange Divider Line -->
  <line x1="60" y1="305" x2="340" y2="305" stroke="#E65A00" stroke-width="3"/>

  <!-- UNIVERSITY -->
  <text x="200" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="8">UNIVERSITY</text>
</svg>
