<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" rx="32" fill="#FFFFFF"/>
  
  <!-- IGNOU EMBLEM -->
  <g transform="translate(100, 20)">
    <circle cx="100" cy="100" r="95" fill="#003399"/>
    <circle cx="100" cy="100" r="82" fill="#FFFFFF"/>
    <circle cx="100" cy="100" r="74" fill="#F37021"/>
    
    <!-- Open Book / Spread Wings -->
    <path d="M 45,95 Q 100,75 100,120 Q 100,75 155,95 L 155,135 Q 100,115 100,150 Q 100,115 45,135 Z" fill="#FFFFFF"/>
