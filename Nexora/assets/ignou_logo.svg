  <!-- TYPOGRAPHY -->
  <text x="200" y="285" font-family="'Arial Black', 'Inter', sans-serif" font-size="72" font-weight="900" fill="#003399" text-anchor="middle" letter-spacing="4">IGNOU</text>
  <text x="200" y="340" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#F37021" text-anchor="middle" letter-spacing="3">THE PEOPLE'S UNIVERSITY</text>
